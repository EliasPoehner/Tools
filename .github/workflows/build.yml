name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # .venv hier anlegen, damit build.bat dieselbe Python-Version nutzt wie die Tests.
      - name: Tests
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -q -r requirements.txt
          .venv\Scripts\python -m pytest -v
      - name: Scan-Benchmark (vorübergehend, nur Info)
        continue-on-error: true
        run: |
          # Kalt: je Werkzeug mehrere gleichartige Versionsordner, jede Variante liest einen eigenen
          foreach ($tool in Get-ChildItem C:\hostedtoolcache\windows -Directory) {
            $dirs = @(Get-ChildItem $tool.FullName -Directory | Where-Object Name -notlike '3.12*' | ForEach-Object FullName)
            if ($dirs.Count -ge 4) {
              "== $($tool.Name)"
              .venv\Scripts\python scripts/bench_scan.py --cold @dirs
            }
          }
          .venv\Scripts\python scripts/bench_scan.py "C:\Program Files" C:\Windows\System32
      - name: Prozess-Scan in gepackter .exe prüfen (vorübergehend)
        continue-on-error: true
        run: |
          .venv\Scripts\python -m PyInstaller --noconfirm --onefile --console --name scanbench --paths . --distpath benchdist scripts\bench_scan.py *> $null
          benchdist\scanbench.exe "C:\Program Files (x86)"
      - name: werkbank.exe bauen
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: werkbank-exe
          path: dist/werkbank.exe
