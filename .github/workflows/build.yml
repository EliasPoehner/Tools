name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m pip install -q -r requirements.txt
          python -m pytest -v
      - name: werkbank.exe bauen
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: werkbank-exe
          path: dist/werkbank.exe
